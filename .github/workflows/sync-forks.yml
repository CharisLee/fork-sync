name: Sync all forks

on:
  schedule:
    # 每天 09:00 新加坡时间 = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync every fork with its upstream
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          # [不想合并的项目填这里] 逗号分隔的完整仓库名，留空 = 不排除
          # 例: EXCLUDE_REPOS: "CharisLee/old-project,CharisLee/frozen-fork"
          EXCLUDE_REPOS: "CharisLee/aboutme-pets,CharisLee/ARTEX,CharisLee/ppanel-docs,CharisLee/next-terminal,CharisLee/HackBrowserData,CharisLee/goproxy"
          # true = 自动跳过已自带 merge-upstream / sync 类 Action 的 fork，避免重复合并
          SKIP_SELF_MANAGED: "true"
        run: |
          failed=0
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STATE_FILE="sync-state.json"

          # ---------- 状态文件：记录自动排除名单和每个仓库的上次结果 ----------
          # 格式：{"updated_at": ..., "excluded": {"owner/repo": {"code": 422, "error": "...", "since": ...}}, "last": {"owner/repo": {"status": ..., "code": ..., "error": ..., "at": ...}}}
          # 失败的 fork 会被写进 excluded，下次运行跳过它；你去 fork 页面手动同步一次成功后，
          # 下次运行检测到它已跟上游一致，会自动把它移出 excluded、恢复自动同步。
          excluded_json=$(mktemp)
          if [ -f "$STATE_FILE" ]; then
            jq '.excluded // {}' "$STATE_FILE" > "$excluded_json" 2>/dev/null || echo '{}' > "$excluded_json"
          else
            echo '{}' > "$excluded_json"
          fi
          results_json=$(mktemp)
          echo '{}' > "$results_json"

          record() {
            local r="$1" s="$2" c="$3" e="$4"
            local tmp
            tmp=$(mktemp)
            jq --arg r "$r" --arg s "$s" --arg c "$c" --arg e "$e" --arg n "$now" \
              '.[$r] = {"status": $s, "code": $c, "error": $e, "at": $n}' \
              "$results_json" > "$tmp" && mv "$tmp" "$results_json"
          }
          is_excluded() {
            jq -e --arg r "$1" 'has($r)' "$excluded_json" >/dev/null 2>&1
          }
          excluded_error() {
            jq -r --arg r "$1" '.[$r].error // ""' "$excluded_json" 2>/dev/null
          }
          add_excluded() {
            local r="$1" c="$2" e="$3"
            local tmp
            tmp=$(mktemp)
            jq --arg r "$r" --arg c "$c" --arg e "$e" --arg n "$now" \
              '.[$r] = {"code": $c, "error": $e, "since": $n}' \
              "$excluded_json" > "$tmp" && mv "$tmp" "$excluded_json"
          }
          drop_excluded() {
            local tmp
            tmp=$(mktemp)
            jq --arg r "$1" 'del(.[$r])' "$excluded_json" > "$tmp" && mv "$tmp" "$excluded_json"
          }

          {
            echo "## 同步结果"
            echo ""
            echo "失败的 fork 会显示 GitHub 返回的错误信息，并自动取消同步（记在 sync-state.json 里）；"
            echo "去 fork 页面手动同步一次成功后，下次运行会自动恢复它的自动同步。"
            echo ""
            echo "| Fork | 上游 | 结果 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "== 列出账号下所有 fork =="
          repos=$(gh repo list --fork --limit 1000 --json nameWithOwner --jq '.[].nameWithOwner')

          if [ -z "$repos" ]; then
            echo "没有找到任何 fork。"
            exit 0
          fi

          for repo in $repos; do
            branch=$(gh api "repos/$repo" --jq '.default_branch')
            parent=$(gh api "repos/$repo" --jq '.parent.full_name // empty')

            if [ -z "$parent" ]; then
              echo "[SKIP] $repo：没有上游仓库"
              echo "| $repo | - | 跳过：没有上游 |" >> "$GITHUB_STEP_SUMMARY"
              record "$repo" "skipped_no_upstream" "" ""
              continue
            fi

            # 1) 排除清单：不想合并的项目直接跳过
            if [ -n "$EXCLUDE_REPOS" ]; then
              excluded=0
              old_ifs="$IFS"; IFS=','
              for part in $EXCLUDE_REPOS; do
                clean=$(echo "$part" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
                me=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
                if [ "$clean" = "$me" ]; then excluded=1; fi
              done
              IFS="$old_ifs"
              if [ "$excluded" = "1" ]; then
                echo "[SKIP] $repo：已设为不参与同步（EXCLUDE_REPOS）"
                echo "| $repo | $parent | 跳过：已设为不参与同步 |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "skipped_manual" "" ""
                continue
              fi
            fi

            # 2) 自动排除名单：先看是不是已经手动同步好了，好了就恢复自动同步
            if is_excluded "$repo"; then
              up_branch=$(gh api "repos/$parent" --jq '.default_branch' 2>/dev/null || true)
              behind=""
              if [ -n "$up_branch" ]; then
                behind=$(gh api "repos/$repo/compare/${parent%%/*}:$up_branch...${repo%%/*}:$branch" --jq '.behind_by' 2>/dev/null || true)
              fi
              if [ "$behind" = "0" ]; then
                drop_excluded "$repo"
                echo "[OK] $repo：已手动同步，恢复自动同步"
                echo "| $repo | $parent | 已手动同步，恢复自动同步 |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "rejoined" "" ""
              else
                err=$(excluded_error "$repo")
                echo "[SKIP] $repo：已取消自动同步（上次失败：$err）"
                echo "| $repo | $parent | 跳过：已取消自动同步（$err） |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "skipped_auto" "" "$err"
              fi
              continue
            fi

            # 3) 自动检测自带同步 Action：有就跳过，避免两个任务重复合并
            if [ "$SKIP_SELF_MANAGED" = "true" ]; then
              self_managed=0
              wf_files=$(gh api "repos/$repo/contents/.github/workflows" --jq '.[].name' 2>/dev/null || true)
              for f in $wf_files; do
                lower_f=$(echo "$f" | tr '[:upper:]' '[:lower:]')
                case "$lower_f" in
                  *upstream*|*sync-fork*|*fork-sync*|*merge-upstream*) self_managed=1 ;;
                esac
                if [ "$self_managed" = "0" ]; then
                  raw=$(gh api "repos/$repo/contents/.github/workflows/$f" --jq '.content // empty' 2>/dev/null || true)
                  decoded=$(echo "$raw" | base64 -d 2>/dev/null || true)
                  if echo "$decoded" | grep -qi "merge-upstream"; then self_managed=1; fi
                fi
              done
              if [ "$self_managed" = "1" ]; then
                echo "[SKIP] $repo：检测到自带同步 Action，跳过中央同步"
                echo "| $repo | $parent | 跳过：项目自带同步 Action |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "skipped_self" "" ""
                continue
              fi
            fi

            code=$(curl -s -o /tmp/merge.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/merge-upstream" \
              -d "{\"branch\": \"$branch\"}")
            errmsg=$(jq -r '.message // empty' /tmp/merge.json 2>/dev/null || true)
            errmsg="${errmsg//|/ }"

            case "$code" in
              200)
                merge_type=$(jq -r '.merge_type // empty' /tmp/merge.json)
                echo "[OK] $repo：已同步（上游 $parent，方式 $merge_type）"
                echo "| $repo | $parent | 已同步 ($merge_type) |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "synced" "200" ""
                ;;
              204)
                echo "[OK] $repo：本来就是最新的"
                echo "| $repo | $parent | 已是最新 |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "up_to_date" "204" ""
                ;;
              *)
                if [ "$code" = "409" ]; then
                  label="有冲突，需手动处理"
                elif [ "$code" = "422" ]; then
                  label="无法同步"
                else
                  label="失败"
                fi
                echo "[FAIL] $repo：$label（HTTP $code）：$errmsg"
                echo "| $repo | $parent | 失败：$label（HTTP $code）—— $errmsg；已取消自动同步 |" >> "$GITHUB_STEP_SUMMARY"
                record "$repo" "failed" "$code" "$errmsg"
                add_excluded "$repo" "$code" "$errmsg"
                failed=1
                ;;
            esac
          done

          # ---------- 写回状态文件（有变化才提交） ----------
          new_state=$(mktemp)
          jq -n --arg now "$now" --slurpfile ex "$excluded_json" --slurpfile last "$results_json" \
            '{updated_at: $now, excluded: $ex[0], last: $last[0]}' > "$new_state"
          if [ ! -f "$STATE_FILE" ] || ! cmp -s "$new_state" "$STATE_FILE"; then
            cp "$new_state" "$STATE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "Update sync state (auto-excluded failures)" || true
            git push || echo "推送状态文件失败，下次运行会重试"
          fi

          if [ "$failed" -ne 0 ]; then
            echo "有 fork 同步失败，见上表。失败的已取消自动同步，错误信息写在表里和 sync-state.json 中。被跳过的项目不算失败。"
            exit 1
          fi
          echo "全部完成。"
